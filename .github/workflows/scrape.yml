name: Daily Price Scraper

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        run: npm run scrape

      - name: Commit updated prices
        run: |
          git config user.name "Price Scraper Bot"
          git config user.email "scraper@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "Update prices $(date -u +%Y-%m-%d)"
          git push
